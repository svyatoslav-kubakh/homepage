name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:
    branches:
      - master

env:
  ARTIFACT_NAME: kubakh-name-files

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout theme
        run: git submodule update --init
      - name: Setup Imagick
        run: sudo apt-get -y install imagemagick
      - name: Prepare icons
        run: ./scripts/prepare_icons.sh
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vendor libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build CV PDF
        run: python -m rendercv render content/cv/rendercv.yaml --pdf-path svyatoslav-kubakh-cv.pdf --dont-generate-png --dont-generate-markdown --dont-generate-html
      - name: Compile site files
        run: python -m pelican
      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            output
            !output/**/.gitignore
            !output/**/.webassets-cache
  deploy:
    name: Deploy
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: public
      - name: Prepare firebase config
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_CONFIG }}' > ./firebase.json
      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KSAR_HOMEPAGE }}'
          projectId: ksar-homepage
          channelId: live
